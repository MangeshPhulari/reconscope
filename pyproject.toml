[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconscope"
version = "3.0.0"
description = "Authorized endpoint and parameter enumeration for owned targets"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mangesh Phulari" }]
license = { text = "MIT" }
keywords = ["recon", "crawler", "security", "enumeration", "paramspider", "hakrawler"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "requests>=2.31",
  "rich>=13.0",
]

[project.scripts]
reconscope = "reconscope.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
